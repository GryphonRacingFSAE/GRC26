[project]
name = "grc-lora-telemetry-viewer"
version = "0.1.0"
description = "Serial telemetry validation and CSV logging for Gryphon Racing"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
]

[project.scripts]
grc-lora-csv = "grc_lora_telemetry.csv_logger:cli"

[tool.setuptools.packages.find]
where = ["src"]
