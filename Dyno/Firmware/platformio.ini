[env:esp32-s3-devboard]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

upload_speed = 2000000
monitor_speed = 9600
debug_tool = esp-builtin
debug_init_break = break setup
build_type = debug

build_flags = 
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I include/Tasks
  -I include/Defines

lib_deps =
  bogde/HX711 @ ^0.7.5
